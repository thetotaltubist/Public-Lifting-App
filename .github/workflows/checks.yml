name: Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npx expo lint
      # Fails if any package is off the version this Expo SDK expects, or if
      # a native library is installed twice (that mismatch made the header flash)
      - run: npx expo install --check
